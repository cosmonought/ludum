# Ludum · publish ludum.netadao.org by ALLOW-LIST (platform/tools/build-site.mjs).
#
# Deployed from the branch, GitHub Pages publishes every file in the repository (it has .nojekyll), including the
# platform's tests, development harnesses, tools and build inputs. This workflow publishes only what the pages use,
# after the §2.4 script check and the platform tests pass.
#
# OWNER ACTION, once, at publication: Settings → Pages → Build and deployment → Source: "GitHub Actions". Until then
# Pages keeps deploying the branch and this workflow's deploy step is refused (nothing is published twice).
name: Publish Ludum (allow-list)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The §2.4 script rule
        run: node platform/tools/check-scripts.mjs
      - name: Platform tests
        run: node --test platform/tests/*.test.mjs platform/tools/tests/*.test.mjs
      - name: Build the published site
        run: node platform/tools/build-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
